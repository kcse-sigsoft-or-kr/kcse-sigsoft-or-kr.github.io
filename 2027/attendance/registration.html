<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>참가 등록 | KCSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Roboto+Slab:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script src="../assets/js/site.js" defer></script>
  </head>
  <body data-nav-group="attend" data-nav-id="registration">
    <div data-component="hero"></div>
    <div data-component="navigation"></div>
    <p id="site-status" role="status" hidden></p>
    <noscript>일정과 메뉴를 보려면 브라우저에서 JavaScript를 활성화해 주세요.</noscript>
    <div class="main-container">
      <main class="content-area">
<section id="registration">
  <div class="breadcrumb">
    <span>참가안내</span> &gt;
    <span class="breadcrumb-current">참가 등록</span>
  </div>
  <h1 class="page-title">참가 등록 (Registration)</h1>
  <div class="section-card">
    <h2>사전 등록 안내</h2>
    <p>
      사전 등록 기간:
      <strong><span data-schedule="registration"></span></strong>
    </p>
    <p>사전 등록 기간에 신청하시면 할인된 등록비가 적용됩니다.</p>
  </div>
  <table class="info-table">
    <thead>
      <tr>
        <th>구분</th>
        <th>사전 등록비</th>
        <th>현장 등록비</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>일반</td>
        <td>260,000원</td>
        <td>300,000원</td>
      </tr>
      <tr>
        <td>학생</td>
        <td>200,000원</td>
        <td>250,000원</td>
      </tr>
      <tr>
        <td>학부/주니어</td>
        <td>120,000원</td>
        <td>140,000원</td>
      </tr>
    </tbody>
  </table>
  <p>
    <a
      class="btn-action"
      data-site-url="registration_url"
      target="_blank"
      rel="noopener"
    >
      온라인 등록 사이트 바로가기
      <i class="fa-solid fa-arrow-up-right-from-square"></i>
    </a>
  </p>
</section>
      </main>
      <div data-component="sidebar"></div>
    </div>
    <div data-component="footer"></div>
  </body>
</html>
